[package]
name = "ferrocat-icu"
version = "1.3.0"
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Compact, Rust-native ICU MessageFormat parsing primitives for ferrocat."
documentation = "https://docs.rs/ferrocat-icu"
readme = "README.md"
keywords = ["ferrocat", "icu", "messageformat", "i18n", "parser"]
categories = ["internationalization", "localization", "parser-implementations"]

[lib]
path = "src/lib.rs"

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
memchr = "2.7.6"
serde = { version = "1.0.228", features = ["derive"], optional = true }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
ferrocat-conformance = { path = "../ferrocat-conformance" }
proptest = "1"
serde_json = "1.0.145"

[lints]
workspace = true
