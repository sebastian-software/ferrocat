[package]
name = "ferrocat-po"
version = "1.2.0"
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Performance-first PO parsing, serialization, and catalog update primitives for ferrocat."
documentation = "https://docs.rs/ferrocat-po"
readme = "README.md"
keywords = ["ferrocat", "gettext", "po", "i18n", "parser"]
categories = ["internationalization", "localization", "parser-implementations"]

[lib]
path = "src/lib.rs"

[features]
default = ["full"]
full = ["catalog"]
catalog = [
    "dep:ferrocat-icu",
    "dep:icu_locale",
    "dep:icu_plurals",
    "dep:serde_json",
    "dep:sha2",
    "dep:tempfile",
    "ferrocat-icu/serde",
    "serde",
]
compile = ["catalog"]
mt = ["catalog"]
ndjson = ["catalog"]
plurals = ["catalog"]
serde = ["dep:serde"]

[dependencies]
ferrocat-icu = { version = "1.2.0", path = "../ferrocat-icu", default-features = false, optional = true }
icu_locale = { version = "2.1.1", optional = true }
icu_plurals = { version = "2.1.1", features = ["compiled_data"], optional = true }
memchr = "2.7.6"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.145", optional = true }
sha2 = { version = "0.11.0", optional = true }
tempfile = { version = "3.23.0", optional = true }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
ferrocat-conformance = { path = "../ferrocat-conformance" }
proptest = "1"
serde_json = "1.0.145"

[lints]
workspace = true
