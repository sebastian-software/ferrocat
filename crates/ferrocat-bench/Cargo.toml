[package]
name = "ferrocat-bench"
version = "3.5.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "Workspace-only benchmark harness for ferrocat parser, serializer, and catalog workloads."

[[bin]]
name = "ferrocat-bench"
path = "src/main.rs"

[features]
# Swaps in a counting global allocator and enables the `alloc-stats` command.
# Off by default so timing benchmarks run against the unmodified system allocator.
count-alloc = []

[dependencies]
ferrocat-conformance = { path = "../ferrocat-conformance" }
ferrocat-icu = { version = "3.5.0", path = "../ferrocat-icu", default-features = false, features = ["serde"] }
ferrocat-po = { version = "3.5.0", path = "../ferrocat-po", default-features = false, features = ["full"] }
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tempfile = "3.23.0"
time = { version = "0.3.44", features = ["formatting"] }

[lints]
workspace = true
