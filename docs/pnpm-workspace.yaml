packages:
  - "."

allowBuilds:
  esbuild: true
  unrs-resolver: true

# First-party packages — no supply-chain cooldown for our own releases.
minimumReleaseAgeExclude:
  - "@sebastian-gmbh/*"
  - "@sebastian-software/*"
  - ferramenta-family@3.0.0
  - "@ferriki/core@1.4.0"
  - "@ferriki/darwin-arm64@1.4.0"
  - "@ferriki/linux-arm64-gnu@1.4.0"
  - "@ferriki/linux-arm64-musl@1.4.0"
  - "@ferriki/linux-x64-gnu@1.4.0"
  - "@ferriki/linux-x64-musl@1.4.0"
  - "@ferriki/win32-arm64-msvc@1.4.0"
  - "@ferriki/win32-x64-msvc@1.4.0"
  - "@ferrolink/darwin-arm64@0.2.2"
  - "@ferrolink/darwin-x64@0.2.2"
  - "@ferrolink/linux-arm64-gnu@0.2.2"
  - "@ferrolink/linux-arm64-musl@0.2.2"
  - "@ferrolink/linux-x64-gnu@0.2.2"
  - "@ferrolink/linux-x64-musl@0.2.2"
  - "@ferrolink/win32-arm64-msvc@0.2.2"
  - "@ferrolink/win32-x64-msvc@0.2.2"
  - ferrolink@0.2.2
