name: Fuzz

on:
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Per-target fuzzing budget in seconds"
        required: false
        default: "45"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FUZZ_MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || '45' }}

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: parse_po
            seed_dir: seed-corpus/po
          - target: parse_po_borrowed
            seed_dir: seed-corpus/po
          - target: parse_catalog_po
            seed_dir: seed-corpus/po
          - target: parse_catalog_fcl
            seed_dir: seed-corpus/fcl
          - target: parse_icu
            seed_dir: seed-corpus/icu
          - target: merge_catalog
            seed_dir: seed-corpus/po
          - target: update_catalog
            seed_dir: seed-corpus/po

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-fuzz

      - name: Prepare target corpus
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}" "fuzz/artifacts/${{ matrix.target }}"
          cp -R "fuzz/${{ matrix.seed_dir }}/." "fuzz/corpus/${{ matrix.target }}/"

      - name: Run bounded fuzz target
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }}
          --
          -max_total_time="${FUZZ_MAX_TOTAL_TIME}"
          -timeout=10
          -rss_limit_mb=2048
          -artifact_prefix="fuzz/artifacts/${{ matrix.target }}/"

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
