name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    name: Docs build
    runs-on: ubuntu-24.04
    env:
      PNPM_STORE_DIR: ~/.pnpm-store

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack and prepare pnpm
        working-directory: docs
        run: |
          corepack enable
          corepack install
          pnpm config set store-dir "$PNPM_STORE_DIR"

      - name: Restore pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('docs/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        working-directory: docs
        run: pnpm build

      - name: Check published benchmark numbers
        run: node scripts/check-published-numbers.mjs

  rust-lint:
    name: Rust lint
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check documented feature profiles
        run: |
          cargo check -p ferrocat-po --no-default-features --locked
          cargo check -p ferrocat-po --no-default-features --features serde --locked
          cargo check -p ferrocat-po --no-default-features --features catalog --locked
          cargo check -p ferrocat-po --no-default-features --features compile,mt,plurals --locked
          cargo check -p ferrocat --no-default-features --locked
          cargo check -p ferrocat --no-default-features --features serde --locked
          cargo check -p ferrocat --no-default-features --features catalog --locked
          cargo check -p ferrocat --no-default-features --features compile,mt,plurals --locked

  rustdoc:
    name: Rustdoc warnings
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Rust docs with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  package:
    name: Published crate packaging
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Package published crates
        run: cargo package -p ferrocat-icu -p ferrocat-po -p ferrocat -p ferrocat-cli --locked

  semver:
    name: Semver compatibility (${{ matrix.crate }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        crate:
          - ferrocat-icu
          - ferrocat-po
          - ferrocat

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check public API compatibility
        # The planned 2.1 cleanup window accepts reviewed public API cleanups
        # that remove accidental coupling. Keep the report visible without
        # blocking those documented exceptions.
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: ${{ matrix.crate }}
          feature-group: all-features

  public-api:
    name: Public API snapshot
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-30

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version 0.52.0 --locked

      - name: Check public API snapshots
        env:
          PUBLIC_API_TOOLCHAIN: nightly-2026-06-30
        run: bash scripts/check-public-api-snapshots.sh

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust 1.93.0
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test workspace with MSRV
        run: cargo +1.93.0 test --workspace --all-features --locked

  musl:
    name: Linux musl target
    runs-on: ubuntu-24.04
    env:
      MUSL_TARGET: x86_64-unknown-linux-musl

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.MUSL_TARGET }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: musl-${{ env.MUSL_TARGET }}

      - name: Build workspace for musl
        run: cargo build --workspace --all-targets --all-features --locked --target "$MUSL_TARGET"

      - name: Run workspace tests for musl
        run: cargo test --workspace --all-features --locked --target "$MUSL_TARGET"

      - name: Smoke test musl CLI
        run: "./target/${MUSL_TARGET}/debug/ferrocat --help"

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked

  coverage:
    name: Linux test + coverage
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run instrumented workspace tests
        run: >-
          cargo llvm-cov --workspace --all-features --locked
          --lcov --output-path target/lcov.info
          --ignore-filename-regex 'crates/ferrocat-(bench|conformance)/'

      - name: Generate JSON coverage summary
        run: >-
          cargo llvm-cov report --json --summary-only
          --output-path target/coverage-summary.json
          --ignore-filename-regex 'crates/ferrocat-(bench|conformance)/'

      - name: Enforce crate coverage thresholds
        # The umbrella `ferrocat` crate is intentionally reported by
        # coverage-gate but not threshold-gated while it only re-exports lower
        # level crates plus smoke tests. Add a threshold here when executable
        # umbrella code grows.
        run: node scripts/coverage-gate.mjs target/coverage-summary.json ferrocat-cli=85 ferrocat-po=95 ferrocat-icu=95

      - name: Upload coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'dependabot/')) }}
        uses: codecov/codecov-action@v7
        with:
          files: target/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Skip Codecov upload without repository secrets
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'dependabot/')) }}
        run: echo "Skipping Codecov upload because fork and Dependabot pull requests do not receive repository secrets."

      - name: Upload LCOV artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: target/lcov.info

      - name: Upload coverage summary artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary-json
          path: target/coverage-summary.json
