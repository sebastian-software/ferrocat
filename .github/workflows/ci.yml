name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  workflow-pins:
    name: Workflow action pins
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that every action is pinned to a commit SHA
        run: scripts/check-workflow-pins.sh

  docs:
    name: Docs build
    runs-on: ubuntu-24.04
    env:
      PNPM_STORE_DIR: ~/.pnpm-store

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack and prepare pnpm
        working-directory: docs
        run: |
          corepack enable
          corepack install
          pnpm config set store-dir "$PNPM_STORE_DIR"

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('docs/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Check generated collation table
        run: node scripts/generate-collation-table.mjs --check

      - name: Build docs site
        working-directory: docs
        run: pnpm build

      - name: Check published benchmark numbers
        run: node scripts/check-published-numbers.mjs

  rust-lint:
    name: Rust lint
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check documented feature profiles
        run: |
          cargo check -p ferrocat-po --no-default-features --locked
          cargo check -p ferrocat-po --no-default-features --features serde --locked
          cargo check -p ferrocat-po --no-default-features --features catalog --locked
          cargo check -p ferrocat-po --no-default-features --features compile,mt,plurals --locked
          cargo check -p ferrocat --no-default-features --locked
          cargo check -p ferrocat --no-default-features --features serde --locked
          cargo check -p ferrocat --no-default-features --features catalog --locked
          cargo check -p ferrocat --no-default-features --features compile,mt,plurals --locked

  rustdoc:
    name: Rustdoc warnings
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build Rust docs with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  package:
    name: Published crate packaging
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Package and test published crates
        run: scripts/test-packaged-crates.sh

  semver:
    name: Semver compatibility (${{ matrix.crate }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        crate:
          - ferrocat-icu
          - ferrocat-po
          - ferrocat

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check public API compatibility
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: ${{ matrix.crate }}
          feature-group: all-features

  public-api:
    name: Public API snapshot
    runs-on: ubuntu-24.04
    env:
      PUBLIC_API_TOOLCHAIN: nightly-2026-06-30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: ${{ env.PUBLIC_API_TOOLCHAIN }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version 0.52.0 --locked

      - name: Check public API snapshots
        run: bash scripts/check-public-api-snapshots.sh

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `rust-version` in Cargo.toml is the only place the MSRV is declared;
      # reading it here keeps the lane from drifting behind a bump.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "Could not read rust-version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test workspace with MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+${MSRV}" test --workspace --all-features --locked

  musl:
    name: Linux musl target
    runs-on: ubuntu-24.04
    env:
      MUSL_TARGET: x86_64-unknown-linux-musl

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: ${{ env.MUSL_TARGET }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: musl-${{ env.MUSL_TARGET }}

      - name: Build workspace for musl
        run: cargo build --workspace --all-targets --all-features --locked --target "$MUSL_TARGET"

      - name: Run workspace tests for musl
        run: cargo test --workspace --all-features --locked --target "$MUSL_TARGET"

      - name: Smoke test musl CLI
        run: "./target/${MUSL_TARGET}/debug/ferrocat --help"

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked

  coverage:
    name: Linux test + coverage
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov

      - name: Run instrumented workspace tests and enforce thresholds
        # `scripts/coverage.sh` is the single source for the llvm-cov filters
        # and the per-crate thresholds; CONTRIBUTING.md and AGENTS.md point
        # contributors at the same script instead of restating the commands.
        run: scripts/coverage.sh

      - name: Upload coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'dependabot/')) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: target/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Skip Codecov upload without repository secrets
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'dependabot/')) }}
        run: echo "Skipping Codecov upload because fork and Dependabot pull requests do not receive repository secrets."

      - name: Upload LCOV artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: target/lcov.info

      - name: Upload coverage summary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary-json
          path: target/coverage-summary.json
