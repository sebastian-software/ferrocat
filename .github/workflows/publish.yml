name: Publish

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      product_tag_name: ${{ steps.release.outputs.tag_name }}
      product_version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # The product release uses the virtual workspace manifest as its version
      # source. Release Please's simple strategy updates that manifest but not
      # Cargo.lock, so regenerate the lockfile on the release PR branch before
      # CI validates it with --locked.
      - name: Set Rust for release lockfile
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Synchronize release PR lockfile
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          release_branch="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base "$GITHUB_REF_NAME" \
              --label "autorelease: pending" \
              --json headRefName \
              --jq 'map(select(.headRefName | startswith("release-please--branches--"))) | .[0].headRefName'
          )"

          if [ -z "$release_branch" ] || [ "$release_branch" = "null" ]; then
            echo "Expected a pending Release Please branch for ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

          git fetch origin "$release_branch"
          git switch --detach "origin/$release_branch"
          # Re-resolve only because the release PR changed local workspace
          # package versions. Unlike `cargo generate-lockfile`, this preserves
          # the existing locked registry dependency set.
          cargo metadata --no-deps --format-version 1 > /dev/null

          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(release): synchronize Cargo.lock"
          git push origin "HEAD:refs/heads/$release_branch"

  publish-cli-musl:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MUSL_TARGET: x86_64-unknown-linux-musl

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve product release
        id: cli-release
        shell: bash
        env:
          RELEASE_PLEASE_PRODUCT_TAG: ${{ needs.release-please.outputs.product_tag_name }}
          RELEASE_PLEASE_PRODUCT_VERSION: ${{ needs.release-please.outputs.product_version }}
        run: |
          version="$RELEASE_PLEASE_PRODUCT_VERSION"
          if [ -z "$version" ]; then
            package_id="$(cargo pkgid -p ferrocat-cli)"
            version="${package_id##*#}"
          fi

          tag="$RELEASE_PLEASE_PRODUCT_TAG"
          if [ -z "$tag" ]; then
            tag="ferrocat-v${version}"
          fi

          artifact_name="ferrocat-${version}-${MUSL_TARGET}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Confirm product release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${{ steps.cli-release.outputs.tag }}" --json tagName,url

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.MUSL_TARGET }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-cli-musl-${{ env.MUSL_TARGET }}

      - name: Build ferrocat CLI for musl
        run: cargo build --release -p ferrocat-cli --locked --target "$MUSL_TARGET"

      - name: Smoke test musl CLI
        run: "./target/${MUSL_TARGET}/release/ferrocat --help"

      - name: Package musl CLI artifact
        shell: bash
        env:
          ARTIFACT_NAME: ${{ steps.cli-release.outputs.artifact_name }}
        run: |
          artifact_dir="target/dist/${ARTIFACT_NAME}"

          mkdir -p "$artifact_dir"
          cp "target/${MUSL_TARGET}/release/ferrocat" "$artifact_dir/ferrocat"
          cp LICENSE "$artifact_dir/LICENSE"
          cp README.md "$artifact_dir/README.md"
          cp crates/ferrocat-cli/README.md "$artifact_dir/CLI-README.md"

          tar -C target/dist -czf "target/dist/${ARTIFACT_NAME}.tar.gz" "$ARTIFACT_NAME"
          ( cd target/dist && sha256sum "${ARTIFACT_NAME}.tar.gz" > "${ARTIFACT_NAME}.tar.gz.sha256" )

      - name: Upload musl CLI artifact to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload
          "${{ steps.cli-release.outputs.tag }}"
          "target/dist/${{ steps.cli-release.outputs.artifact_name }}.tar.gz"
          "target/dist/${{ steps.cli-release.outputs.artifact_name }}.tar.gz.sha256"
          --clobber

  publish-rust:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Authenticate to crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Run locked workspace tests before publish
        run: cargo test --workspace --all-features --locked

      - name: Publish Rust crates in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          crate_version() {
            local crate="$1"
            local package_id
            package_id="$(cargo pkgid -p "$crate")"
            echo "${package_id##*#}"
          }

          crate_index_path() {
            # Sparse index layout: 1/name, 2/name, 3/{first char}/name,
            # {first two}/{next two}/name for longer names.
            local crate="$1"
            case "${#crate}" in
              1) echo "1/${crate}" ;;
              2) echo "2/${crate}" ;;
              3) echo "3/${crate:0:1}/${crate}" ;;
              *) echo "${crate:0:2}/${crate:2:2}/${crate}" ;;
            esac
          }

          crate_version_exists() {
            local crate="$1"
            local version="$2"
            local index_body

            # Capture the body instead of piping so a curl failure (network
            # error, HTTP 5xx) is distinguishable from "version not found".
            if ! index_body="$(curl -fsSL --retry 3 "https://index.crates.io/$(crate_index_path "$crate")")"; then
              echo "::warning::crates.io index lookup failed for ${crate}; treating ${version} as unpublished." >&2
              return 1
            fi
            grep -qF "\"vers\":\"${version}\"" <<< "$index_body"
          }

          publish_with_retry() {
            local crate="$1"
            local attempts="$2"
            local delay="$3"
            local attempt
            local version

            version="$(crate_version "$crate")"
            if crate_version_exists "$crate" "$version"; then
              echo "Skipping ${crate} ${version}; it already exists on crates.io."
              return 0
            fi

            for attempt in $(seq 1 "$attempts"); do
              if cargo publish -p "$crate" --locked; then
                return 0
              fi
              if crate_version_exists "$crate" "$version"; then
                echo "Skipping ${crate} ${version}; it appeared on crates.io after publish attempt ${attempt}."
                return 0
              fi
              if [ "$attempt" -eq "$attempts" ]; then
                return 1
              fi
              echo "Waiting ${delay}s before retrying $crate..."
              sleep "$delay"
            done
          }

          publish_with_retry ferrocat-icu 1 0
          publish_with_retry ferrocat-po 5 30
          publish_with_retry ferrocat 5 30
          publish_with_retry ferrocat-cli 5 30
