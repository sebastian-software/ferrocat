[workspace]
members = [
    "crates/ferrocat",
    "crates/ferrocat-cli",
    "crates/ferrocat-po",
    "crates/ferrocat-icu",
    "crates/ferrocat-conformance",
    "crates/ferrocat-bench",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "2.2.0"
edition = "2024"
homepage = "https://github.com/sebastian-software/ferrocat"
license = "MIT"
repository = "https://github.com/sebastian-software/ferrocat"
rust-version = "1.93.0"

[workspace.dependencies]
ferrocat-conformance = { path = "crates/ferrocat-conformance" }
ferrocat-icu = { version = "2.2.0", path = "crates/ferrocat-icu", default-features = false }
ferrocat-po = { version = "2.2.0", path = "crates/ferrocat-po", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
needless_borrow = "deny"
redundant_clone = "deny"

# Fat LTO + a single codegen unit trade longer release builds for faster
# binaries. This applies to the workspace's own binaries (CLI, benches);
# library consumers build under their own release profile.
[profile.release]
lto = "fat"
codegen-units = 1
