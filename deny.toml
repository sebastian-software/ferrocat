[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.8
# The allow-list is the shared Ferramenta baseline, so entries that no
# current dependency happens to use are expected rather than drift.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
deny = []
skip = [
  { crate = "syn@2.0.119", reason = "ICU4X 2.2 proc macros still require syn 2 while serde_derive 1.0.229 uses syn 3" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
